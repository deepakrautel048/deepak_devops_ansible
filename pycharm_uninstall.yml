---
 - name: windows basic authentication
   hosts: windows
   gather_facts: no
   tasks:
     - name: Check if PyCharm uninstaller exists
       ansible.windows.win_shell: |
         if (Test-Path "C:\Program Files\JetBrains\PyCharm 2024.3.6\bin\Uninstall.exe") {
          Write-Output "FOUND"
         } else {
          Write-Output "NOT_Available"
         }
       register: pycharm_check
       changed_when: false

     - name: uninstall pycharm version
       ansible.windows.win_shell: |
         Start-Process `
           -FilePath "C:\Program Files\JetBrains\PyCharm 2024.3.6\bin\Uninstall.exe" `
           -ArgumentList "/S" `
           -Wait `
           -NoNewWindow
       when: "'FOUND' in pycharm_check.stdout"
       register: pycharm_uninstall
       
     - name: debug uninstallation
       debug:
         var: pycharm_uninstall


