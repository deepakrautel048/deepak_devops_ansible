---
- name: Manage PyCharm versions on Windows
  hosts: windows
  gather_facts: no

  tasks:
    - name: Get installed PyCharm versions
      win_shell: |
        Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*,
                         HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* |
        Where-Object { $_.DisplayName -match "PyCharm" } |
        Select DisplayName
      register: pycharm_list
      changed_when: false
      failed_when: false

    - name: Debug installed PyCharm versions
      debug:
        var: pycharm_list.stdout_lines

    # --------------------------------------
    # UNINSTALL ONLY IF OLD VERSION EXISTS
    # --------------------------------------
    - name: Uninstall PyCharm versions older than 2025
      win_shell: |
        Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*,
                         HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* |
        Where-Object { $_.DisplayName -match "PyCharm" -and $_.DisplayName -match '(\d{4})' -and [int]$matches[1] -lt 2025 } |
        ForEach-Object { Start-Process "cmd.exe" "/c `"$($_.UninstallString)`" /S" -Wait }
      args:
        executable: powershell.exe
      when: pycharm_list.stdout is search("PyCharm") and
            pycharm_list.stdout is not search("2025")

    # --------------------------------------
    # INSTALL ONLY IF 2025 NOT PRESENT
    # --------------------------------------
    - name: Install PyCharm 2025.3
      win_package:
        path: C:\temp-area\pycharm-2025.3.exe
        state: present
        arguments:
          - /S
          - /D=C:\Program Files\JetBrains\PyCharm 2025.3
      when: pycharm_list.stdout is not search("2025")
