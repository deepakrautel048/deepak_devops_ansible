---
- hosts: all
  become: true
  tasks:
    - name: install apache httpd
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes
    - name: start apache httpd service
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes
    - name: Copy an index file
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Welcome to Ansible Managed Apache Server</h1>"
        owner: root
        group: root
        mode: '0644'
