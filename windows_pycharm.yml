---
- name: Manage PyCharm on Windows
  hosts: windows
  gather_facts: no

  tasks:
    - name: Get installed PyCharm versions
      win_shell: |
        Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*,
                         HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* |
        Where-Object { $_.DisplayName -like "PyCharm*" } |
        Select-Object -ExpandProperty DisplayName
      register: pycharm_list
      changed_when: false
      failed_when: false

    - name: Debug installed PyCharm versions
      debug:
        var: pycharm_list.stdout_lines

    # -------------------------------------------------
    # UNINSTALL all PyCharm versions EXCEPT 2025
    # -------------------------------------------------
    - name: Uninstall PyCharm versions older than 2025
      win_shell: |
        Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*,
                         HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* |
        Where-Object { $_.DisplayName -like "PyCharm*" -and $_.DisplayName -notlike "*2025*" } |
        ForEach-Object { & "$($_.UninstallString)" /S }
      args:
        executable: powershell.exe
      when: pycharm_list.stdout is search("PyCharm") and
            pycharm_list.stdout is not search("2025")

    # -------------------------------------------------
    # INSTALL PyCharm 2025 ONLY if missing
    # -------------------------------------------------
    - name: Install PyCharm 2025
      win_package:
        path: C:\temp-area\pycharm-2025.3.exe
        state: present
        arguments:
          - /S
          - /D=C:\Program Files\JetBrains\PyCharm 2025
      when: pycharm_list.stdout is not search("2025")
