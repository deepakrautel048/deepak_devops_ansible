---
# tasks file for packages
- name:  install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - packages
    - nginx

- name: ensure nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
  tags:
    - nginx


